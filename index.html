<!doctype html>
<html lang="tg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>NFC Payment | Пардохт</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#30343b 0%,#101115 42%,#08090b 85%);color:white;display:grid;place-items:center;padding:24px}.panel{width:min(100%,420px);padding:38px 25px;border:1px solid #41434a;border-radius:30px;background:linear-gradient(155deg,#24262b99,#0c0d10ee);box-shadow:0 30px 80px #0008;text-align:center}.symbol{width:62px;height:62px;border:1px solid #686a71;border-radius:19px;margin:0 auto 23px;display:grid;place-items:center;font-size:30px}h1{font-size:29px;letter-spacing:-.8px;margin:0 0 10px}p{color:#b6b8be;line-height:1.55;margin:0 0 26px}.bank{width:100%;border:1px solid #d9d9dd;background:#f8f8fa;color:#111;border-radius:17px;padding:19px 18px;font-size:18px;font-weight:750;display:flex;justify-content:space-between;align-items:center;margin:12px 0;cursor:pointer}.bank:active{transform:scale(.99)}.bank span:last-child{font-size:22px}.number{margin:26px 0 10px;font-size:26px;font-weight:700;letter-spacing:1px}.muted{font-size:13px;color:#a3a5ac}.info{min-height:68px;margin-top:20px;padding:15px;border:1px solid #494b53;border-radius:15px;color:#e1e1e5;font-size:14px;line-height:1.55}footer{margin-top:20px;color:#858790;font-size:12px}
</style></head><body><main class="panel"><div class="symbol">◈</div><h1>Пардохти NFC</h1><p>Бонки худро интихоб кунед.<br>Маблағро дар барномаи бонк ворид намоед.</p><button class="bank" onclick="choose('Alif')"><span>ALIF</span><span>›</span></button><button class="bank" onclick="choose('Dushanbe City')"><span>DUSHANBE CITY</span><span>›</span></button><div class="number" id="number">171000004</div><div class="muted">Рақами қабулкунандаи пардохт</div><div class="info" id="info" role="status" aria-live="polite">Барои нусха кардани рақам яке аз бонкҳоро интихоб кунед.</div><footer>Пардохт танҳо дар барномаи расмии бонк тасдиқ мешавад.</footer></main><script>
const number='171000004';
async function choose(bank){let copied=false;try{await navigator.clipboard.writeText(number);copied=true}catch(e){const el=document.createElement('textarea');el.value=number;document.body.appendChild(el);el.select();try{copied=document.execCommand('copy')}catch(e){}el.remove()}document.getElementById('info').textContent=(copied?'✓ Рақам нусха шуд. ':'Рақамро аз боло нусха кунед. ')+ 'Барномаи '+bank+'-ро кушоед, ба бахши интиқол гузаред, рақами '+number+'-ро ворид кунед ва маблағро худатон тасдиқ намоед.'}
</script></body></html>
